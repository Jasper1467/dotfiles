add_newline = false
scan_timeout = 30

format = """
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$package\
$golang\
$zig\
$cmake\
$character
"""

[hostname]
style = "bold #565f89"

[cmd_duration]
style = "bold #bb9af7"

[line_break]
disabled = true

[character]
success_symbol = "[❯](bold #9d7cd8) "
error_symbol = "[❯](bold #f7768e) "
vicmd_symbol = "[❮](bold #bb9af7) "

[username]
style_user = "bold #9d7cd8"
style_root = "bold #f7768e"
format = "[$user]($style) "
disabled = false
show_always = true

[directory]
truncation_length = 3
truncate_to_repo = true
read_only = " "
style = "bold #565f89"
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "bold #7aa2f7"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #565f89"
format = "[($all_status$ahead_behind)]($style)"

staged = "[●](#e0af68)"
modified = "[✱](#ff9e64)"
deleted = "[✖](#f7768e)"
conflicted = "[‼](#f7768e)"
renamed = "[➜](#7aa2f7)"
untracked = "[…](#9ece6a)"
stashed = "[⚑](#bb9af7)"

ahead = "[↑${count}](#e0af68)"
behind = "[↓${count}](#7aa2f7)"

[cmake]
format = "[$symbol($version )]($style)"
style = "bold #565f89"

[zig]
format = "[$symbol($version )]($style)"
style = "bold #bb9af7"

[golang]
format = '[$symbol($version )($mod_version )]($style)'
style = "bold #7aa2f7"

[bun]
format = "[$symbol($version )]($style)"
style = "bold #ff9e64"

[docker_context]
format = "[$symbol$context]($style) "
symbol = "🐳 "
style = "bold #7dcfff"

[nodejs]
format = "[$symbol$version ]($style)"
symbol = "⬢ "
style = "bold #7dcfff"

[package]
format = "[$symbol$version]($style) "
symbol = "📦 "
style = "bold #ff75a0"
