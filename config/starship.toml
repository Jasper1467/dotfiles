add_newline = false
scan_timeout = 30

format = """
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$package\
$golang\
$zig\
$cmake\
$character"""

[hostname]
style = "bold #8b83aa"

[cmd_duration]
style = "bold #bd93f9"

[line_break]
disabled = true

[character]
success_symbol = "[❯](bold #bd93f9) "
error_symbol = "[❯](bold #ff79c6) "
vicmd_symbol = "[❮](bold #80d9ff) "

[username]
style_user = "bold #bd93f9"
style_root = "bold #ff79c6"
format = "[$user]($style) "
disabled = false
show_always = true

[directory]
truncation_length = 3
truncate_to_repo = true
read_only = " "
style = "bold #e6ddff"
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "bold #80d9ff"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #a99bc9"
format = "[($all_status$ahead_behind)]($style)"

staged = "[●](#bd93f9)"
modified = "[✱](#ff79c6)"
deleted = "[✖](#ff5555)"
conflicted = "[‼](#ff5555)"
renamed = "[➜](#80d9ff)"
untracked = "[…](#8be9fd)"
stashed = "[⚑](#bd93f9)"

ahead = "[↑${count}](#80d9ff)"
behind = "[↓${count}](#ff79c6)"

[cmake]
format = "[$symbol($version )]($style)"
style = "bold #80d9ff"

[zig]
format = "[$symbol($version )]($style)"
style = "bold #bd93f9"

[golang]
format = '[$symbol($version )($mod_version )]($style)'
style = "bold #80d9ff"

[bun]
format = "[$symbol($version )]($style)"
style = "bold #ff79c6"

[docker_context]
format = "[$symbol$context]($style) "
symbol = "󰡨 "
style = "bold #80d9ff"

[nodejs]
format = "[$symbol$version ]($style)"
symbol = "⬢ "
style = "bold #8be9fd"

[package]
format = "[$symbol$version]($style) "
symbol = "󰏗 "
style = "bold #ff79c6"
