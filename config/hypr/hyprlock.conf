general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.18
    vibrancy_darkness = 0.2
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(bd93f9ff)
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(090617cc)
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(80d9ffff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 320, 58

    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(554078ff)
    inner_color = rgba(0d0c1ef5)

    font_color = rgba(e6ddffff)
    check_color = rgba(80d9ffff)
    fail_color = rgba(ff79c6ff)

    placeholder_text = Enter password
    fail_text = Incorrect password

    fade_on_empty = false
    rounding = 14

    position = 0, -100
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(090617cc)
}

